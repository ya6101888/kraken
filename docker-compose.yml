services:
  kraken:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kraken
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - /opt/kraken/secrets/.env
    volumes:
      - /opt/kraken/secrets:/app/secrets:ro
      - /opt/kraken/sessions:/app/sessions
      - /opt/kraken/logs:/app/logs
      - /opt/kraken/dlq:/app/dlq
      - /opt/kraken/prompts:/app/prompts:ro
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"